<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Career Guidance Chat</title>
    <link rel="stylesheet" href="carrer.css">
</head>

<body>

<div class="chat-container">
    <h2>🎓 Career Guidance Assistant</h2>

    <div id="chatBox" class="chat-box"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask your career question...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <div class="quick-prompts">
        <p><b>Quick Questions:</b></p>
        <button onclick="quickAsk('Which career suits me?')">Which career suits me?</button>
        <button onclick="quickAsk('What skills are needed for IT jobs?')">Skills for IT?</button>
        <button onclick="quickAsk('How to improve my resume?')">Improve Resume</button>
        <button onclick="quickAsk('Best certifications after diploma?')">Certifications</button>
        <button onclick="quickAsk('How to prepare for interviews?')">Interview Tips</button>
        <button onclick="quickAsk('Career in networking?')">Networking Career</button>
        <button onclick="quickAsk('Career in software development?')">Software Career</button>
        <button onclick="quickAsk('How to identify skill gaps?')">Skill Gap</button>
        <button onclick="quickAsk('What are trending jobs?')">Trending Jobs</button>
        <button onclick="quickAsk('How to become job ready?')">Job Ready</button>
        <button onclick="quickAsk('Importance of soft skills?')">Soft Skills</button>
    </div>

    <button class="back-btn" onclick="goHome()">⬅ Back to Home</button>
</div>

<script src="career.js"></script>
</body>
</html>
